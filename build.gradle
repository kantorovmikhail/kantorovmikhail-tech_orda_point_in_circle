plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
tasks.register('assignment', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.example.circle.assignment.CircleAssignment'
}

springBoot { mainClass = 'com.example.circle.WebApplication' }
tasks.register('cli', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.circle.CliApplication'
}
